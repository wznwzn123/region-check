<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>区域指纹检测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centered column. Header bar, title block, a single stage card (mascot left, score ring right), then a plain ruled list of the six signals. */
  :root {
    --bg: #FAF8F3;
    --surface: #FFFFFF;
    --ink: #2B2520;
    --muted: #756A60;
    --line: #E8E1D6;
    --line-strong: #CFC5B6;
    --chip: #F3EFE7;
    --accent: #BC5835;
    --accent-ink: #FFFFFF;
    --ok: #3F7A4A;
    --warn: #A97410;
    --hot: #B23C22;
    --track: #EEEAE1;
    --elev: rgba(60, 40, 20, .14);
    --skin: #EBB78E;
    --skin-d: #D79F74;
    --jacket: #34505B;
    --jacket-d: #283E48;
    --cream: #F7EFE1;
    --brim: #9E4527;
    --blush: #F2A08C;
    --face: #2A2018;
    --sh-soft: rgba(60, 40, 20, .14);
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1714; --surface: #23201C; --ink: #F2ECE3; --muted: #A99D8F;
      --line: #38322B; --line-strong: #4D453B; --chip: #2D2823;
      --accent: #DB7650; --accent-ink: #1A1410;
      --ok: #86BB8C; --warn: #E2B04F; --hot: #F08C6C; --track: #34302A;
      --elev: rgba(0, 0, 0, .5);
      --skin: #DFAA82; --skin-d: #C98F66; --jacket: #476977; --jacket-d: #38545F;
      --cream: #EADFCB; --brim: #B4552F; --blush: #E58E7B; --sh-soft: rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1714; --surface: #23201C; --ink: #F2ECE3; --muted: #A99D8F;
    --line: #38322B; --line-strong: #4D453B; --chip: #2D2823;
    --accent: #DB7650; --accent-ink: #1A1410;
    --ok: #86BB8C; --warn: #E2B04F; --hot: #F08C6C; --track: #34302A;
    --elev: rgba(0, 0, 0, .5);
    --skin: #DFAA82; --skin-d: #C98F66; --jacket: #476977; --jacket-d: #38545F;
    --cream: #EADFCB; --brim: #B4552F; --blush: #E58E7B; --sh-soft: rgba(0, 0, 0, .4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 960px; margin-inline: auto; padding-inline: 16px; }

  /* header */
  .top { border-bottom: 1px solid var(--line); background: var(--bg); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; min-width: 0; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); flex: none; }
  .lang button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .lang button:focus-visible, .go:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* hero */
  .hero { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-block: 36px 24px; text-align: center; }
  .badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 500; color: var(--accent); background: var(--surface); }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 7.4vw, 46px); line-height: 1.2; letter-spacing: .01em; text-wrap: balance; }

  /* stage */
  .stage {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px 64px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 32px 20px; box-shadow: 0 1px 2px var(--elev), 0 18px 36px -22px var(--elev);
  }
  .mascot-box { width: 160px; max-width: 100%; }
  .mascot { display: block; width: 100%; height: auto; overflow: visible; }
  .mascot [data-show] { display: none; }
  .mascot[data-state="idle"] [data-show~="idle"],
  .mascot[data-state="scan"] [data-show~="scan"],
  .mascot[data-state="low"] [data-show~="low"],
  .mascot[data-state="mid"] [data-show~="mid"],
  .mascot[data-state="high"] [data-show~="high"] { display: inline; }
  .f-skin { fill: var(--skin); } .f-skin-d { fill: var(--skin-d); }
  .f-jacket { fill: var(--jacket); } .f-jacket-d { fill: var(--jacket-d); }
  .f-cream { fill: var(--cream); } .f-accent { fill: var(--accent); }
  .f-brim { fill: var(--brim); } .f-blush { fill: var(--blush); opacity: .55; }
  .f-face { fill: var(--face); } .f-white { fill: #fff; } .f-drop { fill: #8EC5E8; }
  .f-soft { fill: var(--sh-soft); }
  .s-face { stroke: var(--face); fill: none; stroke-width: 3; stroke-linecap: round; }
  .s-line { stroke: var(--jacket-d); fill: none; stroke-width: 2; }
  .head { transform-box: view-box; transform-origin: 80px 100px; transition: transform .6s ease; }
  .mascot[data-state="idle"] .head { transform: rotate(-7deg); }
  .mascot[data-state="scan"] .head { animation: nod .7s ease-in-out infinite alternate; }
  .bubble { fill: none; stroke: var(--face); stroke-opacity: .35; stroke-width: 1.5; transform-box: fill-box; transform-origin: left center; animation: puff 2.6s ease-in-out infinite; }
  .zzz { font-family: var(--serif); font-weight: 700; fill: var(--muted); }
  .z1 { animation: drift 2.6s ease-in-out infinite; }
  .z2 { animation: drift 2.6s ease-in-out .9s infinite; }
  @keyframes nod { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes puff { 0%, 100% { transform: scale(.55); } 50% { transform: scale(1.15); } }
  @keyframes drift { 0% { transform: translateY(5px); opacity: 0; } 35% { opacity: 1; } 100% { transform: translateY(-9px); opacity: 0; } }

  .meter { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
  .gauge { position: relative; width: 176px; height: 176px; --ring: var(--line-strong); }
  .gauge[data-level="low"] { --ring: var(--ok); }
  .gauge[data-level="mid"] { --ring: var(--warn); }
  .gauge[data-level="high"] { --ring: var(--hot); }
  .gauge svg { display: block; width: 100%; height: 100%; }
  .trk { fill: none; stroke: var(--track); stroke-width: 16; }
  .arc { fill: none; stroke: var(--ring); stroke-width: 16; stroke-linecap: round; stroke-dasharray: 0 477.5; transition: stroke .3s; }
  .read { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .read b { font-family: var(--serif); font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .read span { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
  .pill { border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); padding: 5px 18px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .pill[data-level="low"] { color: var(--ok); }
  .pill[data-level="mid"] { color: var(--warn); }
  .pill[data-level="high"] { color: var(--hot); }
  .sum { margin: 0; min-height: 3.2em; max-width: 30ch; font-size: 13.5px; color: var(--muted); text-align: center; text-wrap: balance; }
  .go {
    display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 14px 30px;
    font-size: 16px; font-weight: 700; box-shadow: 0 8px 18px -8px var(--accent); transition: transform .15s;
  }
  .go:hover { transform: translateY(-1px); }
  .go:disabled { opacity: .7; cursor: progress; transform: none; }
  .go svg { flex: none; }
  .go.spin svg { animation: turn .9s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 11.5px; color: var(--muted); }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

  /* signals */
  .signals { padding-block: 40px 20px; }
  h2 { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 700; }
  .sub { margin: 4px 0 16px; font-size: 13.5px; color: var(--muted); }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .ico { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); color: var(--accent-ink); }
  li[data-s="scan"] .ico { border-color: var(--track); border-top-color: var(--accent); animation: turn .8s linear infinite; }
  li[data-s="hit"] .ico { background: var(--accent); border-color: var(--accent); }
  li[data-s="part"] .ico { background: var(--warn); border-color: var(--warn); }
  li[data-s="miss"] .ico { background: var(--track); border-color: var(--track); color: var(--muted); }
  .nm { font-weight: 700; }
  .ds { font-size: 13px; color: var(--muted); }
  .val { display: inline-block; max-width: 100%; margin-top: 6px; padding: 2px 8px; border-radius: 6px; background: var(--chip); font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  .pt { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; white-space: nowrap; }
  li[data-s="hit"] .pt, li[data-s="part"] .pt { color: var(--ink); font-weight: 500; }
  .note { margin: 0; padding-block: 8px 40px; font-size: 12.5px; color: var(--muted); max-width: 62ch; }

  .opt { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .opt input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .optnote { margin: -4px 0 0; max-width: 34ch; font-size: 11.5px; line-height: 1.5; color: var(--muted); text-align: center; }
  .cred { margin: -4px 0 0; min-height: 1.5em; max-width: 32ch; font-size: 12.5px; text-align: center; color: var(--muted); }
  .cred[data-bad="1"] { color: var(--warn); font-weight: 500; }
  .gap { margin-top: 40px; }
  li[data-s="ok"] .ico { background: var(--ok); border-color: var(--ok); }
  li[data-s="bad"] .ico { background: var(--hot); border-color: var(--hot); }
  li[data-s="ok"] .pt { color: var(--ok); }
  li[data-s="bad"] .pt { color: var(--hot); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 14a7.5 7.5 0 0 1 15 0"/><path d="M8 15a4 4 0 0 1 8 0"/><path d="M12 15v4"/></svg>
      </span>
      <span data-i18n="brand">区域指纹</span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="false">English</button>
      <button type="button" id="lang-zh" aria-pressed="true">中文</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="badge"><i></i><span data-i18n="badge">所有检测都在你的浏览器内完成</span></span>
    <h1 data-i18n="h1">你是「中国用户」吗</h1>
  </section>

  <section class="stage" aria-label="detector">
    <div class="mascot-box">
      <svg class="mascot" id="mascot" data-state="idle" viewBox="0 0 160 200" role="img" aria-label="">
        <ellipse class="f-soft" cx="80" cy="191" rx="46" ry="6"/>
        <path class="f-jacket-d" d="M36 120 Q18 142 25 174 L41 174 Q44 146 46 124 Z"/>
        <path class="f-jacket-d" d="M124 120 Q142 142 135 174 L119 174 Q116 146 114 124 Z"/>
        <circle class="f-skin" cx="33" cy="178" r="8"/>
        <circle class="f-skin" cx="127" cy="178" r="8"/>
        <path class="f-jacket" d="M36 190 L40 124 Q42 104 62 100 L98 100 Q118 104 120 124 L124 190 Z"/>
        <path class="f-cream" d="M64 100 L80 122 L96 100 Z"/>
        <path class="f-accent" d="M77 114 L83 114 L86 142 L80 150 L74 142 Z"/>
        <path class="s-line" d="M98 150 h14 v14 h-14 z"/>
        <g class="head">
          <rect class="f-skin-d" x="70" y="92" width="20" height="14" rx="4"/>
          <circle class="f-skin" cx="46" cy="72" r="6"/>
          <circle class="f-skin" cx="114" cy="72" r="6"/>
          <circle class="f-skin" cx="80" cy="68" r="34"/>
          <path class="f-accent" d="M45 62 Q46 28 80 28 Q114 28 115 62 Z"/>
          <rect class="f-brim" x="43" y="56" width="74" height="13" rx="6.5"/>
          <circle class="f-cream" cx="80" cy="24" r="8"/>
          <circle class="f-blush" cx="62" cy="90" r="5"/>
          <circle class="f-blush" cx="98" cy="90" r="5"/>
          <g data-show="idle"><path class="s-face" d="M60 79 Q66 84 72 79"/><path class="s-face" d="M88 79 Q94 84 100 79"/></g>
          <g data-show="scan low mid">
            <circle class="f-face" cx="66" cy="79" r="4"/><circle class="f-face" cx="94" cy="79" r="4"/>
            <circle class="f-white" cx="67.3" cy="77.7" r="1.3"/><circle class="f-white" cx="95.3" cy="77.7" r="1.3"/>
          </g>
          <g data-show="high">
            <circle class="f-white s-face" style="stroke-width:2" cx="66" cy="79" r="7.5"/><circle class="f-white s-face" style="stroke-width:2" cx="94" cy="79" r="7.5"/>
            <circle class="f-face" cx="66" cy="79" r="3"/><circle class="f-face" cx="94" cy="79" r="3"/>
            <path class="f-drop" d="M123 74 Q128 82 123 86 Q118 82 123 74 Z"/>
          </g>
          <ellipse data-show="idle" class="f-face" cx="80" cy="95" rx="4" ry="3.2"/>
          <circle data-show="idle" class="bubble" cx="85" cy="94" r="6"/>
          <path data-show="low" class="s-face" d="M70 92 Q80 102 90 92"/>
          <path data-show="scan mid" class="s-face" d="M73 95 L87 95"/>
          <ellipse data-show="high" class="f-face" cx="80" cy="96" rx="5" ry="6.5"/>
        </g>
        <g data-show="idle" class="zzz">
          <text class="z1" x="116" y="42" font-size="16">z</text>
          <text class="z2" x="130" y="26" font-size="22">Z</text>
        </g>
      </svg>
    </div>

    <div class="meter">
      <div class="gauge" id="gauge" data-level="">
        <svg viewBox="0 0 176 176" aria-hidden="true">
          <circle class="trk" cx="88" cy="88" r="76"/>
          <circle class="arc" id="arc" cx="88" cy="88" r="76" transform="rotate(-90 88 88)"/>
        </svg>
        <div class="read"><b id="num">0</b><span>/ 100</span></div>
      </div>
      <div class="pill" id="pill" aria-live="polite">待检测</div>
      <p class="sum" id="sum" aria-live="polite"></p>
      <p class="cred" id="cred" aria-live="polite"></p>
      <button type="button" class="go" id="go">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        <span id="go-t">开始检测</span>
      </button>
      <label class="opt" for="enh"><input type="checkbox" id="enh"><span data-i18n="enh">加强检测：联网查 IP、读取定位</span></label>
      <p class="optnote" id="enhnote" data-i18n="enhNote" hidden></p>
      <div class="chips">
        <span class="chip"><i></i><span id="chip1" data-i18n="chip1">纯本地检测</span></span>
        <span class="chip"><i></i><span data-i18n="chip2">结果零上传</span></span>
        <span class="chip"><i></i><span data-i18n="chip3">无需登录</span></span>
      </div>
    </div>
  </section>

  <section class="signals">
    <h2 data-i18n="sigTitle">检测哪些信号</h2>
    <p class="sub" id="sig-sub"></p>
    <ul class="list" id="list"></ul>
    <h2 class="gap" data-i18n="checkTitle">一致性检查</h2>
    <p class="sub" data-i18n="checkSub">核对各项读数之间有没有互相矛盾。</p>
    <ul class="list" id="clist"></ul>
  </section>
  <p class="note" id="note"></p>
</main>

<script>
(function () {
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var C = 2 * Math.PI * 76;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var T = {
    zh: {
      brand: '区域指纹', badge: '检测结果只会显示在你的浏览器里', h1: '你是「中国用户」吗',
      hint: '点击下方按钮开始，约需 4 秒。', reading: '正在读取浏览器信号…',
      start: '开始检测', again: '重新检测', busy: '检测中',
      chip1: '纯本地检测', chip1b: '含联网查询', chip2: '结果不上传', chip3: '无需登录',
      enh: '加强检测：联网查 IP、读取定位',
      enhNote: 'IP 会发给第三方查询服务。定位需要你授权，坐标只在本机比对，不会上传。',
      sigTitle: '检测哪些信号',
      sigSub: function (n) { return n + ' 项区域指纹，加权得出 0–100 分。'; },
      checkTitle: '一致性检查', checkSub: '核对各项读数之间有没有互相矛盾。',
      ck_ok: '一致', ck_bad: '矛盾', ck_na: '无需核对',
      credOk: '各项读数之间没有矛盾。',
      credBad: function (n) { return '发现 ' + n + ' 处矛盾，这次的读数仅供参考。'; },
      p_idle: '待检测', p_scan: '检测中…', p_low: '特征不明显', p_mid: '部分吻合', p_high: '高度吻合',
      sumNone: '没有发现明显的中国区域特征。',
      sumSome: function (n, m, l) { return m + ' 项信号中有 ' + n + ' 项吻合：' + l + '。'; },
      sep: '、',
      note: '这只是浏览器环境的参考分数，不能判断国籍或所在地。基础检测不会发送任何数据。',
      noteNet: '加强检测会把你的 IP 发给第三方查询服务，定位坐标只在本机比对。',
      unk: '无法读取', none: '未发现', std: '常规浏览器', denied: '未授权', offline: '查询失败', alt: '中国用户检测器',
      s: {
        tz: ['时区', '浏览器报告的时区名称。中国大陆通常是 Asia/Shanghai。'],
        tzhist: ['时区历史', '1988 年夏季的时钟偏移。真正的中国时区那时是 UTC+9，现在是 UTC+8。'],
        lang: ['语言偏好', '首选语言列表。简体中文排在最前得分最高。'],

      els.sum.textContent = hits.length ? t('sumSome')(hits.length, valid, hits.join(t('sep'))) : t('sumNone');
    }
    els.goT.textContent = S.phase === 'scan' ? t('busy') : S.phase === 'done' ? t('again') : t('start');
    els.go.disabled = S.phase === 'scan';
    els.go.classList.toggle('spin', S.phase === 'scan');
    els.enh.disabled = S.phase === 'scan';
    els.mascot.setAttribute('aria-label', t('alt'));
    renderRows();
    renderChecks();
  }

  function paint(v) {
    shown = v;
    els.num.textContent = Math.round(v);
    els.arc.style.strokeDasharray = (C * v / 100) + ' ' + C;
    els.arc.style.opacity = v > 0.4 ? 1 : 0;
    els.gauge.dataset.level = v <= 0 ? '' : v < 25 ? 'low' : v < 60 ? 'mid' : 'high';
  }
  function tween(to, ms) {
    cancelAnimationFrame(raf);
    var from = shown, t0 = performance.now();
    if (RM || !ms) { paint(to); return; }
    (function step(now) {
      var k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      paint(from + (to - from) * e);
      if (k < 1) raf = requestAnimationFrame(step);
    })(t0);
  }

  /* Score = matched weight / weight of the signals that could be read, so a denied permission never lowers it. */
  function finalScore() {
    var got = 0, max = 0;
    S.sigs.forEach(function (sig, i) {
      var r = S.results[i];
      if (r && !r.unk) { got += r.f * sig.w; max += sig.w; }
    });
    return max ? Math.round(100 * got / max) : 0;
  }

  async function run() {
    if (S.phase === 'scan') return;
    var sigs = activeSigs();
    S = { phase: 'scan', results: sigs.map(function () { return null; }), checks: [], sigs: sigs, cur: 0, total: 0, level: '' };
    els.mascot.dataset.state = 'scan';
    tween(0, 0);
    renderAll();
    ipP = enh ? lookupIP() : null;
    var plan = sigs.reduce(function (a, s) { return a + s.w; }, 0), raw = 0;
    for (var i = 0; i < sigs.length; i++) {
      S.cur = i; renderRows();
      await wait(RM ? 0 : 360);
      var r;
      try { r = await sigs[i].run(); } catch (e) { r = { f: 0, v: null, unk: true }; }
      S.results[i] = { f: r.f, v: r.v, unk: !!r.unk, reason: r.reason, pts: Math.round(r.f * sigs[i].w) };
      if (!r.unk) raw += r.f * sigs[i].w;
      renderRows();
      tween(Math.round(100 * raw / plan), 380);
    }
    S.checks = CHECKS.map(function (ck) {
      try { return ck.run(); } catch (e) { return { s: 'na', v: null }; }
    });
    S.cur = -1; S.phase = 'done';
    S.total = finalScore();
    S.level = S.total >= 60 ? 'high' : S.total >= 25 ? 'mid' : 'low';
    els.mascot.dataset.state = S.level;
    tween(S.total, 500);
    renderAll();
  }

  function resetIdle() {
    S = { phase: 'idle', results: [], checks: [], sigs: activeSigs(), cur: -1, total: 0, level: '' };
    els.mascot.dataset.state = 'idle';
    tween(0, 0);
    renderAll();
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('region-check-lang', l); } catch (e) {}
    renderAll();
  }

  els.go.addEventListener('click', run);
  els.enh.addEventListener('change', function () {
    if (S.phase === 'scan') { els.enh.checked = enh; return; }
    enh = els.enh.checked;
    resetIdle();
  });
  $('lang-en').addEventListener('click', function () { setLang('en'); });
  $('lang-zh').addEventListener('click', function () { setLang('zh'); });
  renderAll();
})();
</script>
</body>
</html>
